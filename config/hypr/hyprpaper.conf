splash = false

# Empty monitor = applies to every monitor, including hotplugged ones.
# The image is a 4:1 canvas with the logo centered; "cover" scales it by
# screen height and crops the sides, so the logo never stretches on ultrawides.
wallpaper {
    monitor = 
    path = ~/Pictures/Wallpapers/atech-background.png
    fit_mode = cover
}
